# Conda environment for the Paper-Trading Portfolio Tracker (portable: Linux, macOS, Windows).
#   conda env create -f environment.yml      ->   conda activate spt
# Versions: the tested ones are the minimums (">="). Faker is exact, because the
# seeded sample data (etl/seed_sample_data.py) is only reproducible with this version.
# Tested with: Python 3.12.14, psycopg 3.3.4 (libpq 18.6), pandas 3.0.6, python-dotenv 1.2.4,
# tabulate 0.10.0, matplotlib 3.11.2, Faker 40.40.0, yfinance 1.7.0, pytest 9.2.0.
name: spt
channels:
  - conda-forge
dependencies:
  - python=3.12
  - psycopg>=3.3          # PostgreSQL driver (brings libpq)
  - pandas>=3.0           # yfinance data frames (price loader)
  - python-dotenv>=1.2    # reads .env
  - tabulate>=0.10        # tables in the terminal
  - matplotlib-base>=3.9  # PNG charts (no GUI toolkit needed)
  - faker=40.40.0         # sample investor names / emails
  - pytest>=9.0           # tests
  - pip
  - pip:
      - yfinance>=1.7     # Yahoo Finance prices (price loader, Admin -> Add a stock)
